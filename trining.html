<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIvjN9ShdwP5ljqBdgpMsyZRjsoVrPaTDNOQ&s" alt="Profile Picture" class="profile-img">
    <h2>Jane Doe</h2>
    <p class="title">Web Developer</p>
    <p>Passionate about creating amazing web experiences.</p>
    <div class="social-links">
      <a href="#">Facebook</a>
      <a href="#">Twitter</a>
      <a href="#">LinkedIn</a>
    </div>
  </div>
</body>
</html>
